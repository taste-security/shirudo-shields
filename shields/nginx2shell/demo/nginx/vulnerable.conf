# SPDX-License-Identifier: BSD-2-Clause
#
# nginx 1.31.8, in the range CVE-2026-123007 affects. HTTP/2 over TLS on
# 8443 and the SIMULATED post-exploit endpoint. Never send the over-limit
# flow-control pattern of tools/h2probe here.

load_module /usr/lib/nginx/modules/ngx_http_perl_module.so;

user nginx;
worker_processes 2;
pid /run/n2s-vulnerable.pid;
error_log /var/log/nginx/n2s-vulnerable.error.log notice;

events {
	worker_connections 1024;
}

http {
	perl_modules /usr/local/lib/nginx-1.31.8/perl;
	include /etc/nginx/n2s/http.inc;

	access_log /var/log/nginx/n2s-vulnerable.access.log;
	client_body_temp_path /var/cache/nginx/n2s-vulnerable/client;
	proxy_temp_path /var/cache/nginx/n2s-vulnerable/proxy;
	fastcgi_temp_path /var/cache/nginx/n2s-vulnerable/fastcgi;
	uwsgi_temp_path /var/cache/nginx/n2s-vulnerable/uwsgi;
	scgi_temp_path /var/cache/nginx/n2s-vulnerable/scgi;

	server {
		listen 8443 ssl;
		include /etc/nginx/n2s/server.inc;
	}
}
