# SPDX-License-Identifier: BSD-2-Clause
#
# nginx 1.31.9, the release that fixes CVE-2026-123007. HTTP/2 over TLS
# on 9443. The only target of the over-limit flow-control pattern of
# tools/h2probe. Each instance names its own copy of nginx.pm with
# perl_modules: the XS object of one version does not load into another.

load_module /usr/lib/nginx/modules-1.31.9/ngx_http_perl_module.so;

user nginx;
worker_processes 2;
pid /run/n2s-patched.pid;
error_log /var/log/nginx/n2s-patched.error.log notice;

events {
	worker_connections 1024;
}

http {
	perl_modules /usr/local/lib/nginx-1.31.9/perl;
	include /etc/nginx/n2s/http.inc;

	access_log /var/log/nginx/n2s-patched.access.log;
	client_body_temp_path /var/cache/nginx/n2s-patched/client;
	proxy_temp_path /var/cache/nginx/n2s-patched/proxy;
	fastcgi_temp_path /var/cache/nginx/n2s-patched/fastcgi;
	uwsgi_temp_path /var/cache/nginx/n2s-patched/uwsgi;
	scgi_temp_path /var/cache/nginx/n2s-patched/scgi;

	server {
		listen 9443 ssl;
		include /etc/nginx/n2s/server.inc;
	}
}
